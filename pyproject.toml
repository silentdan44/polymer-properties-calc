[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-properties-calc"
version = "0.1.0"
description = "Polymer property estimators built around existing OpenMM simulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openmm>=8.3",
]

[project.optional-dependencies]
openff = [
    "openff-toolkit>=0.16",
    "openff-interchange>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
